<!-- Confirmación antes de cerrar sesión. -->
<div v-if="modalCierreAbierto" class="modal-fondo" @click.self="modalCierreAbierto = false">
  <div class="modal-panel max-w-sm text-center">

    <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-error-50 text-2xl text-error-500 dark:bg-error-500/15">
      <i class="fa-solid fa-right-from-bracket"></i>
    </div>

    <h2 class="modal-titulo">¿Cerrar sesión?</h2>
    <p class="mt-1 text-theme-sm text-gray-500 dark:text-gray-400">
      Tendrás que volver a escribir tu usuario y contraseña para entrar.
    </p>

    <!-- Aviso importante: si hay escaneos sin subir, cerrar sesión ahora
         significa que nadie los va a sincronizar hasta el próximo ingreso. -->
    <div v-if="escaner.estadoRed.pendientes > 0"
         class="mt-4 flex gap-3 rounded-xl border border-warning-200 bg-warning-50 p-3 text-left dark:border-warning-500/30 dark:bg-warning-500/10">
      <i class="fa-solid fa-triangle-exclamation mt-0.5 text-warning-500"></i>
      <p class="text-theme-xs text-gray-700 dark:text-gray-300">
        Tienes <strong>{{ escaner.estadoRed.pendientes }}</strong> registros sin subir.
        Conviene sincronizarlos antes de salir.
      </p>
    </div>

    <div class="mt-6 flex gap-3">
      <button type="button" @click="modalCierreAbierto = false" class="boton boton-secundario flex-1">
        Cancelar
      </button>
      <button type="button" @click="confirmarCierre" class="boton boton-peligro flex-1">
        Cerrar sesión
      </button>
    </div>
  </div>
</div>
