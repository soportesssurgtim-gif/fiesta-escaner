<!--
  Guía contextual de la pantalla actual.

  El contenido sale de contenido/guias.js. Antes existían dos copias de este
  modal en dos layouts distintos, una con iconos de Font Awesome y otra con
  LordIcon, así que la guía se veía diferente según por dónde se abriera.
  Ahora es una sola.
-->
<div v-if="guiaAbierta" class="modal-fondo" @click.self="guiaAbierta = false">
  <div class="modal-panel max-w-lg">

    <div class="mb-5 flex items-start gap-4">
      <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-brand-50 text-xl text-brand-500 dark:bg-brand-500/15 dark:text-brand-400">
        <i class="fa-solid" :class="guiaActual.icono"></i>
      </div>
      <div class="min-w-0 flex-1">
        <h2 class="modal-titulo">{{ guiaActual.titulo }}</h2>
        <p class="text-theme-sm text-gray-500 dark:text-gray-400">Cómo usar esta pantalla</p>
      </div>
      <button type="button" @click="guiaAbierta = false" class="boton-icono shrink-0" aria-label="Cerrar">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <ol class="space-y-4">
      <li v-for="(paso, indice) in guiaActual.pasos" :key="indice" class="flex gap-4">
        <div class="flex flex-col items-center">
          <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-gray-100 text-theme-sm text-gray-600 dark:bg-gray-800 dark:text-gray-400">
            <i class="fa-solid" :class="paso.icono"></i>
          </span>
          <!-- Línea que une los pasos, salvo en el último. -->
          <span v-if="indice < guiaActual.pasos.length - 1"
                class="mt-1 w-px flex-1 bg-gray-200 dark:bg-gray-800"></span>
        </div>
        <div class="pb-1">
          <p class="text-theme-sm font-medium text-gray-800 dark:text-white/90">{{ paso.titulo }}</p>
          <p class="mt-0.5 text-theme-sm text-gray-500 dark:text-gray-400">{{ paso.desc }}</p>
        </div>
      </li>
    </ol>

    <div v-if="guiaActual.tip"
         class="mt-6 flex gap-3 rounded-xl border border-brand-200 bg-brand-25 p-4 dark:border-brand-500/30 dark:bg-brand-500/10">
      <i class="fa-solid fa-lightbulb mt-0.5 text-brand-500"></i>
      <p class="text-theme-sm text-gray-700 dark:text-gray-300">{{ guiaActual.tip }}</p>
    </div>

    <button type="button" @click="guiaAbierta = false" class="boton boton-primario mt-6 w-full">
      Entendido
    </button>
  </div>
</div>
