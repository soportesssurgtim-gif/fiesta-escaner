<!--
  Encabezado fijo.

  Lleva el control del sidebar, el título de la pantalla actual, y a la derecha
  las tres acciones que siempre están a mano: ayuda, tema y menú de usuario.
-->
<header class="sticky top-0 z-30 flex h-[72px] items-center gap-3 border-b border-gray-200 bg-white/95 px-4 backdrop-blur md:px-6 dark:border-gray-800 dark:bg-gray-dark/95">

  <!-- Alternar sidebar. En móvil abre el panel deslizante; en escritorio
       colapsa a solo iconos. -->
  <button type="button"
          @click="esMovil ? (sidebarMovil = !sidebarMovil) : (sidebarAbierto = !sidebarAbierto)"
          class="boton-icono shrink-0"
          aria-label="Mostrar u ocultar el menú">
    <i class="fa-solid fa-bars"></i>
  </button>

  <div class="min-w-0 flex-1">
    <h1 class="truncate text-theme-xl font-semibold text-gray-800 dark:text-white/90">
      {{ tituloVista }}
    </h1>
  </div>

  <!-- Aviso de trabajo sin conexión. Solo aparece cuando hace falta. -->
  <div v-if="!escaner.estadoRed.enLinea"
       class="hidden items-center gap-2 rounded-lg bg-error-50 px-3 py-1.5 sm:flex dark:bg-error-500/10">
    <i class="fa-solid fa-plug-circle-xmark text-error-500"></i>
    <span class="text-theme-xs font-medium text-error-700 dark:text-error-400">Sin conexión</span>
  </div>

  <!--
    Instalar la aplicación. Está siempre visible a propósito: el navegador
    decide por su cuenta si ofrece instalar (y en iPhone no lo ofrece nunca),
    así que dejarlo librado a eso significa que en la mayoría de los teléfonos
    la opción no aparece. Si no hay diálogo nativo, el botón explica los pasos.
  -->
  <button type="button"
          @click="pwa.instalar()"
          :disabled="pwa.instalando"
          class="boton-icono shrink-0"
          :class="{ 'text-brand-500': pwa.instalacionDirecta && !pwa.instalada }"
          :title="pwa.instalada ? 'La aplicación ya está instalada' : 'Instalar la aplicación en este dispositivo'"
          :aria-label="pwa.instalada ? 'La aplicación ya está instalada' : 'Instalar la aplicación en este dispositivo'">
    <i class="fa-solid"
       :class="pwa.instalando ? 'fa-circle-notch animar-girar' : (pwa.instalada ? 'fa-circle-check' : 'fa-download')"></i>
  </button>

  <button type="button" @click="abrirGuia" class="boton-icono shrink-0" aria-label="Ver la guía de esta pantalla">
    <i class="fa-solid fa-circle-question"></i>
  </button>

  <button type="button" @click="alternarTema" class="boton-icono shrink-0"
          :aria-label="modoOscuro ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">
    <i class="fa-solid" :class="modoOscuro ? 'fa-sun' : 'fa-moon'"></i>
  </button>

  <!-- Menú de usuario. El atributo data-menu-usuario lo usa app.js para saber
       si un clic ocurrió dentro o fuera y cerrarlo. -->
  <div class="relative shrink-0" data-menu-usuario>
    <button type="button"
            @click="menuUsuarioAbierto = !menuUsuarioAbierto"
            class="flex items-center gap-2.5 rounded-lg p-1.5 transition hover:bg-gray-100 dark:hover:bg-white/5">
      <span class="flex h-9 w-9 items-center justify-center rounded-full bg-brand-500 text-theme-xs font-semibold text-white">
        {{ iniciales(sesion.nombreMostrar || sesion.usuario) }}
      </span>
      <span class="hidden text-left md:block">
        <span class="block max-w-[160px] truncate text-theme-sm font-medium text-gray-800 dark:text-white/90">
          {{ sesion.nombreMostrar || sesion.usuario }}
        </span>
        <span class="block text-theme-xs text-gray-500 dark:text-gray-400">{{ sesion.rol || 'Sin rol' }}</span>
      </span>
      <i class="fa-solid fa-chevron-down hidden text-theme-xs text-gray-400 md:block"></i>
    </button>

    <div v-if="menuUsuarioAbierto"
         class="animar-aparecer absolute right-0 top-full mt-2 w-64 rounded-xl border border-gray-200 bg-white p-2 shadow-theme-lg dark:border-gray-800 dark:bg-gray-dark">
      <div class="border-b border-gray-200 px-3 pb-3 pt-2 dark:border-gray-800">
        <p class="truncate text-theme-sm font-medium text-gray-800 dark:text-white/90">
          {{ sesion.nombreMostrar || sesion.usuario }}
        </p>
        <p class="truncate text-theme-xs text-gray-500 dark:text-gray-400">
          {{ sesion.correo || sesion.usuario }}
        </p>
        <span class="insignia-marca mt-2">{{ sesion.rol || 'Sin rol' }}</span>
      </div>

      <button type="button"
              @click="menuUsuarioAbierto = false; abrirGuia()"
              class="enlace-menu mt-1">
        <span class="enlace-menu-icono"><i class="fa-solid fa-circle-question"></i></span>
        Guía de esta pantalla
      </button>

      <button type="button" @click="abrirCambioClave()" class="enlace-menu">
        <span class="enlace-menu-icono"><i class="fa-solid fa-key"></i></span>
        Cambiar mi contraseña
      </button>

      <button type="button"
              @click="menuUsuarioAbierto = false; modalCierreAbierto = true"
              class="enlace-menu text-error-600 hover:bg-error-50 hover:text-error-700 dark:text-error-400 dark:hover:bg-error-500/10">
        <span class="enlace-menu-icono"><i class="fa-solid fa-right-from-bracket"></i></span>
        Cerrar sesión
      </button>
    </div>
  </div>
</header>
