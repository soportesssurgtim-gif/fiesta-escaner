<!--
  Barra lateral.

  Tres comportamientos según el ancho:
    · Escritorio abierto   → 290 px, con etiquetas
    · Escritorio colapsado → 90 px, solo iconos con tooltip al pasar el ratón
    · Móvil                → se desliza por encima del contenido, SIEMPRE
                             completo: colapsar a iconos ahí no tiene sentido.

  Por eso el ancho y las etiquetas dependen de `sidebarExpandido` y no de
  `sidebarAbierto`: el segundo arranca en false debajo de 1024 px y dejaba el
  panel móvil en 90 px, con los nombres de las vistas fuera de la pantalla.

  Las opciones salen de contenido/menu.js y se filtran por permisos, así que
  cada persona ve únicamente lo suyo.
-->
<aside class="fixed left-0 top-0 z-50 flex h-screen flex-col border-r border-gray-200 bg-white transition-all duration-300 dark:border-gray-800 dark:bg-gray-dark"
       :class="[
         sidebarExpandido ? 'w-[290px] max-w-[85vw]' : 'w-[90px]',
         sidebarMovil ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'
       ]">

  <!--
    Encabezado con el logo institucional.

    La forma y el tamaño salen de Configuración:

      escudo      el escudo sobre una placa del color primario, con el nombre
                  de la aplicación al lado
      vertical    el logo con «San Salvador Sur» debajo
      horizontal  el logo con «San Salvador Sur» al costado

    Cada forma va en dos archivos y no con un filtro CSS: el azul institucional
    sobre fondo oscuro queda ilegible, y teñirlo con `invert` le cambia el color
    a la marca. La versión blanca es la oficial para fondos oscuros.

    Con la barra plegada quedan 90 px, así que ahí siempre va la placa con el
    escudo: ni el vertical ni el horizontal se leen a ese tamaño, y el ícono de
    la PWA tampoco sirve porque lleva el texto debajo y a 40 px es una mancha.

    El alto es mínimo y no fijo: con el logo vertical grande, un alto fijo lo
    recortaría.
  -->
  <div class="flex min-h-[72px] shrink-0 items-center gap-3 border-b border-gray-200 px-5 py-2 dark:border-gray-800"
       :class="{ 'justify-center px-0': !sidebarExpandido }">

    <!-- Placa con el escudo: forma «escudo», y siempre que esté plegada -->
    <span v-if="!sidebarExpandido || apariencia.logoForma.valor === 'escudo'"
          class="flex shrink-0 items-center justify-center rounded-xl bg-brand-500 p-1.5 shadow-theme-xs"
          :style="sidebarExpandido
                  ? { width: apariencia.anchoSidebar.valor + 'px', height: apariencia.anchoSidebar.valor + 'px' }
                  : { width: '40px', height: '40px' }">
      <img src="/assets/iconos/logo-escudo-blanco.png"
           alt="Escudo de la Alcaldía Municipal de San Salvador Sur"
           class="h-full w-full object-contain" />
    </span>

    <div v-if="sidebarExpandido && apariencia.logoForma.valor === 'escudo'" class="min-w-0">
      <p class="truncate text-theme-sm font-semibold text-gray-800 dark:text-white/90">
        Asistencia SSSur
      </p>
      <p class="truncate text-theme-xs text-gray-500 dark:text-gray-400">
        Gerencia de Tecnología
      </p>
    </div>

    <!-- O el logo entero, que ya trae el nombre de la institución -->
    <template v-if="sidebarExpandido && apariencia.logoForma.valor !== 'escudo'">
      <img :src="apariencia.logoForma.valor === 'vertical'
                 ? '/assets/iconos/logo-vertical-azul.png'
                 : '/assets/iconos/logo-horizontal-azul.png'"
           alt="Alcaldía Municipal de San Salvador Sur"
           class="h-auto max-w-full object-contain dark:hidden"
           :style="{ width: apariencia.anchoSidebar.valor + 'px' }" />
      <img :src="apariencia.logoForma.valor === 'vertical'
                 ? '/assets/iconos/logo-vertical-blanco.png'
                 : '/assets/iconos/logo-horizontal-blanco.png'"
           alt="Alcaldía Municipal de San Salvador Sur"
           class="hidden h-auto max-w-full object-contain dark:block"
           :style="{ width: apariencia.anchoSidebar.valor + 'px' }" />
    </template>
  </div>

  <!-- Evento activo. Es la información más importante de la pantalla: si no
       hay evento activo, el escáner no registra nada. -->
  <div v-if="sidebarExpandido" class="shrink-0 px-4 py-4">
    <div v-if="eventoActivo"
         class="rounded-xl border border-success-200 bg-success-50 p-3 dark:border-success-500/30 dark:bg-success-500/10">
      <div class="flex items-center gap-2">
        <span class="relative flex h-2 w-2">
          <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-success-400 opacity-75"></span>
          <span class="relative inline-flex h-2 w-2 rounded-full bg-success-500"></span>
        </span>
        <p class="text-theme-xs font-semibold uppercase tracking-wide text-success-700 dark:text-success-400">
          Evento activo
        </p>
      </div>
      <p class="mt-1.5 truncate text-theme-sm font-medium text-gray-800 dark:text-white/90"
         :title="eventoActivo.nombre">
        {{ eventoActivo.nombre }}
      </p>
      <p v-if="eventoActivo.fecha_evento" class="text-theme-xs text-gray-500 dark:text-gray-400">
        {{ formatearFechaLarga(eventoActivo.fecha_evento) }}
      </p>
    </div>

    <div v-else
         class="rounded-xl border border-warning-200 bg-warning-50 p-3 dark:border-warning-500/30 dark:bg-warning-500/10">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-triangle-exclamation text-warning-500"></i>
        <p class="text-theme-xs font-semibold uppercase tracking-wide text-warning-700 dark:text-warning-400">
          Sin evento activo
        </p>
      </div>
      <p class="mt-1.5 text-theme-xs text-gray-600 dark:text-gray-400">
        Activa un evento para poder registrar asistencias.
      </p>
    </div>
  </div>

  <!-- Menú -->
  <nav class="flex-1 overflow-y-auto px-4 pb-6" :class="{ 'px-3': !sidebarExpandido }">
    <div v-for="grupo in menuVisible" :key="grupo.titulo" class="mb-6">
      <p v-if="sidebarExpandido" class="grupo-menu-titulo">{{ grupo.titulo }}</p>
      <!-- Colapsado no hay espacio para el título del grupo, así que lo
           reemplazamos por una línea divisoria. -->
      <div v-else class="mb-3 border-t border-gray-200 dark:border-gray-800"></div>

      <ul class="space-y-1">
        <li v-for="item in grupo.items" :key="item.vista">
          <button type="button"
                  @click="cambiarVista(item.vista)"
                  class="enlace-menu relative"
                  :class="[
                    { 'enlace-menu-activo': vista === item.vista },
                    { 'justify-center': !sidebarExpandido }
                  ]"
                  :title="sidebarExpandido ? '' : item.etiqueta">
            <span class="enlace-menu-icono"><i class="fa-solid" :class="item.icono"></i></span>
            <span v-if="sidebarExpandido" class="truncate">{{ item.etiqueta }}</span>
            <span v-if="!sidebarExpandido" class="menu-tooltip">{{ item.etiqueta }}</span>
          </button>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Pie: estado de conexión y pendientes por sincronizar -->
  <div class="shrink-0 border-t border-gray-200 p-4 dark:border-gray-800">
    <div class="flex items-center gap-2" :class="{ 'justify-center': !sidebarExpandido }">
      <span class="h-2 w-2 shrink-0 rounded-full"
            :class="escaner.estadoRed.enLinea ? 'bg-success-500' : 'bg-error-500'"></span>
      <span v-if="sidebarExpandido" class="text-theme-xs text-gray-500 dark:text-gray-400">
        {{ escaner.estadoRed.enLinea ? 'En línea' : 'Sin conexión' }}
      </span>
    </div>

    <!-- Abre la gestión en vez de reintentar a ciegas: si algo se atascó, hay
         que poder ver qué es antes de volver a mandarlo. -->
    <button v-if="escaner.estadoRed.pendientes > 0"
            type="button"
            @click="pendientes.abrir()"
            class="mt-3 w-full rounded-lg border border-warning-300 bg-warning-50 px-3 py-2 text-theme-xs font-medium text-warning-700 transition hover:bg-warning-100 dark:border-warning-500/30 dark:bg-warning-500/10 dark:text-warning-400"
            :title="escaner.estadoRed.pendientes + ' registros sin subir'">
      <i class="fa-solid" :class="escaner.estadoRed.sincronizando ? 'fa-circle-notch animar-girar' : 'fa-cloud-arrow-up'"></i>
      <span v-if="sidebarExpandido" class="ml-1.5">
        {{ escaner.estadoRed.pendientes }} por subir
      </span>
    </button>

    <!--
      Versión que está sirviendo el service worker.

      Solo debajo de 1024 px: en escritorio ya está en el encabezado, y
      repetirla en los dos lados sería ruido. Acá abajo es donde queda a mano
      en el teléfono, que es donde más cuesta saber si la aplicación instalada
      ya se actualizó.
    -->
    <button v-if="sidebarExpandido && pwa.version"
            type="button"
            @click="pwa.consultarVersion()"
            class="mt-3 w-full text-left font-mono text-theme-xs text-gray-400 transition hover:text-gray-600 lg:hidden dark:text-gray-500 dark:hover:text-gray-300"
            title="Versión instalada. Toca para volver a consultarla.">
      <i class="fa-solid fa-code-branch mr-1.5"></i>{{ pwa.version }}
    </button>
  </div>
</aside>
