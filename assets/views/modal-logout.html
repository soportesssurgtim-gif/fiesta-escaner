<div v-if="mostrarModalLogout" class="modal-overlay flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl max-w-xs w-full p-6 text-center shadow-2xl border border-slate-100 space-y-4">
    <div class="w-12 h-12 bg-red-50 text-red-500 rounded-2xl flex items-center justify-center mx-auto text-xl">
      <i class="fas fa-sign-out-alt"></i>
    </div>
    <div>
      <h3 class="text-base font-extrabold text-slate-800">¿Cerrar Sesión?</h3>
      <p class="text-xs text-slate-500 mt-1">Saldrás del turno actual y volverás al inicio de sesión.</p>
    </div>
    <div class="flex gap-2 pt-2">
      <button @click="mostrarModalLogout = false" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-xl font-bold text-xs">Cancelar</button>
      <button @click="confirmarLogout" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2.5 rounded-xl font-bold text-xs shadow">Sí, Salir</button>
    </div>
  </div>
</div>
