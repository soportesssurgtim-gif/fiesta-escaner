<section v-if="vista === 'asistentes'" class="space-y-4">
  <div class="bg-white/80 backdrop-blur-xl p-6 rounded-[2rem] border border-slate-200/60 shadow-sm flex items-center justify-between">
    <div>
      <h2 class="text-base font-extrabold text-slate-800">Registros de Asistencia</h2>
      <p class="text-xs text-slate-500">Historial en tiempo real de accesos al evento</p>
    </div>
    <div class="text-right">
      <span class="text-3xl font-extrabold text-[#001ba0]">{{ asistenciasDetalladas.length }}</span>
      <span class="block text-[10px] font-bold text-slate-400 uppercase">Confirmados</span>
    </div>
  </div>
  <div class="bg-white/80 backdrop-blur-xl rounded-[2rem] border border-slate-200/60 p-5 shadow-sm space-y-3">
    <div class="flex items-center gap-2">
      <input v-model="busquedaAsistencia" type="text" placeholder="Filtrar por empleado o DUI..."
        class="flex-1 p-3 bg-slate-100/70 border border-slate-200/60 rounded-2xl text-xs font-medium outline-none focus:bg-white" />
    </div>
    <div class="space-y-2 max-h-[60vh] overflow-y-auto pr-1">
      <div v-for="ast in asistenciasFiltradas" :key="ast.id"
        class="p-3.5 bg-slate-50/80 rounded-2xl border border-slate-200/50 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-sm font-bold">
            <i class="fas fa-check"></i>
          </div>
          <div>
            <p class="text-xs font-bold text-slate-800">{{ ast.empleadoNombre }}</p>
            <p class="text-[10px] font-medium text-slate-500">DUI: {{ ast.dui }} • {{ ast.fechaHora ? new Date(ast.fechaHora).toLocaleString() : '' }}</p>
          </div>
        </div>
        <div class="text-right">
          <span class="inline-block px-2 py-0.5 bg-slate-200 text-slate-700 rounded-full text-[9px] font-bold uppercase">
            {{ ast.fuente }}
          </span>
        </div>
      </div>
    </div>
  </div>
</section>
