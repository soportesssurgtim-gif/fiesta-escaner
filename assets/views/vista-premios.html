<section v-if="vista === 'premios' && tienePermiso('premios', 'ver')" class="space-y-4">
  <div class="flex items-center justify-between bg-white/80 backdrop-blur-xl p-5 rounded-[2rem] border border-slate-200/60 shadow-sm">
    <div>
      <h2 class="text-base font-extrabold text-slate-800">Catálogo de Premios</h2>
      <p class="text-xs text-slate-500">Premios para la rifa municipal</p>
    </div>
    <button v-if="tienePermiso('premios', 'agregar')" @click="abrirModalPremio()" class="bg-[#001ba0] text-white px-4 py-2.5 rounded-2xl text-xs font-bold shadow ios-btn flex items-center gap-1.5">
      <i class="fas fa-trophy"></i>
      <span>Nuevo Premio</span>
    </button>
  </div>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
    <div v-for="prm in listaPremios" :key="prm.id"
      class="p-5 bg-white/80 backdrop-blur-xl rounded-[2rem] border border-slate-200/60 shadow-sm space-y-2">
      <div class="flex items-center justify-between">
        <span class="w-10 h-10 rounded-2xl bg-amber-50 text-amber-500 flex items-center justify-center text-lg"><i class="fas fa-gift"></i></span>
        <div class="flex items-center gap-1">
          <span class="px-2.5 py-1 bg-amber-100 text-amber-900 rounded-full text-[10px] font-extrabold">Cant: {{ prm.cantidad || 1 }}</span>
          <span class="px-2 py-0.5 text-[9px] font-extrabold rounded-full"
            :class="String(prm.activo).toUpperCase() === 'TRUE' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'">
            {{ String(prm.activo).toUpperCase() === 'TRUE' ? 'ACTIVO' : 'INACTIVO' }}
          </span>
        </div>
      </div>
      <h3 class="text-sm font-extrabold text-slate-800">{{ prm.nombre }}</h3>
      <p class="text-xs text-slate-500 line-clamp-2">{{ prm.descripcion || 'Sin descripción' }}</p>
      <div class="pt-2 flex justify-end">
        <button v-if="tienePermiso('premios', 'editar')" @click="abrirModalPremio(prm)" class="p-2 text-blue-600 hover:bg-blue-50 rounded-xl text-xs font-bold"><i class="fas fa-pen"></i></button>
      </div>
    </div>
  </div>
  <div v-if="modalPremio" class="modal-overlay flex items-center justify-center p-4">
    <div class="bg-white rounded-[2.5rem] p-6 max-w-md w-full shadow-2xl border border-slate-100 space-y-4">
      <h3 class="text-base font-extrabold text-slate-800">{{ formPremio.id ? 'Editar Premio' : 'Nuevo Premio' }}</h3>
      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-bold text-slate-600 mb-1">Nombre del Premio</label>
          <input v-model="formPremio.nombre" type="text" placeholder="Ej. Smart TV 55 pulgadas" class="w-full p-3 bg-slate-100 rounded-2xl outline-none font-bold" />
        </div>
        <div>
          <label class="block font-bold text-slate-600 mb-1">Descripción</label>
          <textarea v-model="formPremio.descripcion" rows="3" placeholder="Detalles del premio..." class="w-full p-3 bg-slate-100 rounded-2xl outline-none font-medium"></textarea>
        </div>
        <div>
          <label class="block font-bold text-slate-600 mb-1">Cantidad Disponible</label>
          <input v-model.number="formPremio.cantidad" type="number" class="w-full p-3 bg-slate-100 rounded-2xl outline-none font-bold" />
        </div>
        <div>
          <label class="block font-bold text-slate-600 mb-1">Estado Premio</label>
          <select v-model="formPremio.activo" class="w-full p-3 bg-slate-100 rounded-2xl outline-none font-bold">
            <option value="TRUE">Activo (Apto para sorteo)</option>
            <option value="FALSE">Inactivo</option>
          </select>
        </div>
      </div>
      <div class="flex gap-2 pt-2">
        <button @click="modalPremio = false" :disabled="guardandoPremio" class="flex-1 bg-slate-100 text-slate-700 py-3 rounded-2xl font-bold text-xs ios-btn disabled:opacity-50">Cancelar</button>
        <button @click="guardarPremioAction" :disabled="guardandoPremio" class="flex-1 bg-[#001ba0] text-white py-3 rounded-2xl font-bold text-xs shadow ios-btn disabled:opacity-50 flex items-center justify-center gap-1.5">
          <span v-if="guardandoPremio"><i class="fas fa-spinner fa-spin"></i> Guardando…</span>
          <span v-else>Guardar</span>
        </button>
      </div>
    </div>
  </div>
</section>
