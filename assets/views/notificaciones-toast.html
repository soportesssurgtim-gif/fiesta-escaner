<div class="toast-container">
  <div v-if="notificacion.visible" :class="['toast', notificacion.tipo === 'exito' ? 'toast-exito' : 'toast-error']">
    <i :class="notificacion.tipo === 'exito' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle'"></i>
    {{ notificacion.mensaje }}
  </div>
</div>
