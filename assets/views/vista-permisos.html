<section v-if="vista === 'permisos' && tienePermiso('permisos', 'ver')" class="space-y-4">
  <div class="flex items-center justify-between bg-white/80 backdrop-blur-xl p-5 rounded-[2rem] border border-slate-200/60 shadow-sm">
    <div>
      <h2 class="text-base font-extrabold text-slate-800">Permisos por Rol</h2>
      <p class="text-xs text-slate-500">Matriz de acceso por módulo para cada rol</p>
    </div>
  </div>
  <div class="bg-white/80 backdrop-blur-xl rounded-[2rem] border border-slate-200/60 p-5 shadow-sm space-y-4">
    <div class="flex flex-wrap gap-2">
      <button v-for="rol in listaRoles" :key="rol.id"
        @click="cambiarRol(rol.id)"
        :class="rolSeleccionado === rol.id ? 'bg-[#001ba0] text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
        class="px-4 py-2 rounded-2xl text-xs font-bold ios-btn transition-colors">
        {{ rol.nombreRol || rol.nombre_rol }}
      </button>
    </div>
    <div v-if="rolSeleccionado" class="space-y-3">
      <div class="flex items-center gap-3">
        <div class="flex-1 relative">
          <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input v-model="busquedaPermiso" type="text" placeholder="Buscar módulo..."
            class="w-full pl-9 pr-4 py-2.5 bg-slate-100 rounded-2xl outline-none text-xs font-medium border border-transparent focus:border-[#001ba0]/30">
        </div>
        <span class="text-[10px] text-slate-400 font-medium">{{ permisosMatriz.length }} módulos</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-xs">
          <thead>
            <tr class="border-b border-slate-200/60">
              <th class="text-left py-2.5 px-3 font-bold text-slate-500 uppercase tracking-wider text-[10px]">Módulo</th>
              <th class="text-center py-2.5 px-3 font-bold text-slate-500 uppercase tracking-wider text-[10px]">Ver</th>
              <th class="text-center py-2.5 px-3 font-bold text-slate-500 uppercase tracking-wider text-[10px]">Agregar</th>
              <th class="text-center py-2.5 px-3 font-bold text-slate-500 uppercase tracking-wider text-[10px]">Editar</th>
              <th class="text-center py-2.5 px-3 font-bold text-slate-500 uppercase tracking-wider text-[10px]">Eliminar</th>
              <th class="text-center py-2.5 px-3 font-bold text-slate-500 uppercase tracking-wider text-[10px]">Todo</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="perm in permisosFiltrados" :key="perm.modulo" class="border-b border-slate-100/50 hover:bg-slate-50/50 transition-colors">
              <td class="py-3 px-3 font-bold text-slate-700 capitalize">{{ perm.modulo }}</td>
              <td class="py-3 px-3 text-center">
                <div @click="alternarPermiso(perm, 'puedeVer')" :class="perm.puedeVer ? 'bg-emerald-500' : 'bg-slate-300'"
                  class="w-10 h-6 rounded-full relative cursor-pointer transition-colors shadow-sm">
                  <div :class="perm.puedeVer ? 'translate-x-4' : 'translate-x-0'" class="w-4 h-4 bg-white rounded-full shadow absolute top-1 left-1 transition-transform"></div>
                </div>
              </td>
              <td class="py-3 px-3 text-center">
                <div @click="alternarPermiso(perm, 'puedeAgregar')" :class="perm.puedeAgregar ? 'bg-emerald-500' : 'bg-slate-300'"
                  class="w-10 h-6 rounded-full relative cursor-pointer transition-colors shadow-sm">
                  <div :class="perm.puedeAgregar ? 'translate-x-4' : 'translate-x-0'" class="w-4 h-4 bg-white rounded-full shadow absolute top-1 left-1 transition-transform"></div>
                </div>
              </td>
              <td class="py-3 px-3 text-center">
                <div @click="alternarPermiso(perm, 'puedeEditar')" :class="perm.puedeEditar ? 'bg-emerald-500' : 'bg-slate-300'"
                  class="w-10 h-6 rounded-full relative cursor-pointer transition-colors shadow-sm">
                  <div :class="perm.puedeEditar ? 'translate-x-4' : 'translate-x-0'" class="w-4 h-4 bg-white rounded-full shadow absolute top-1 left-1 transition-transform"></div>
                </div>
              </td>
              <td class="py-3 px-3 text-center">
                <div @click="alternarPermiso(perm, 'puedeEliminar')" :class="perm.puedeEliminar ? 'bg-emerald-500' : 'bg-slate-300'"
                  class="w-10 h-6 rounded-full relative cursor-pointer transition-colors shadow-sm">
                  <div :class="perm.puedeEliminar ? 'translate-x-4' : 'translate-x-0'" class="w-4 h-4 bg-white rounded-full shadow absolute top-1 left-1 transition-transform"></div>
                </div>
              </td>
              <td class="py-3 px-3 text-center">
                <div @click="alternarTodo(perm)" :class="perm.seleccionado ? 'bg-[#001ba0]' : 'bg-slate-300'"
                  class="w-10 h-6 rounded-full relative cursor-pointer transition-colors shadow-sm">
                  <div :class="perm.seleccionado ? 'translate-x-4' : 'translate-x-0'" class="w-4 h-4 bg-white rounded-full shadow absolute top-1 left-1 transition-transform"></div>
                </div>
              </td>
            </tr>
            <tr v-if="permisosFiltrados.length === 0">
              <td colspan="6" class="py-6 text-center text-slate-400 text-xs font-medium">No se encontraron módulos para "{{ busquedaPermiso }}"</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div v-if="exitoPermisos" class="flex items-center gap-2 p-3 bg-emerald-50 border border-emerald-200 rounded-2xl">
        <i class="fas fa-check-circle text-emerald-500"></i>
        <span class="text-xs font-bold text-emerald-700">{{ exitoPermisos }}</span>
      </div>
    </div>
  </div>
  <div class="flex gap-3">
    <button @click="guardarPermisosRol" :disabled="guardandoPermisos"
      class="flex-1 bg-[#001ba0] text-white py-3 rounded-2xl font-bold text-xs shadow ios-btn disabled:opacity-50 flex items-center justify-center gap-1.5">
      <span v-if="guardandoPermisos"><i class="fas fa-spinner fa-spin"></i> Guardando…</span>
      <span v-else><i class="fas fa-save"></i> Guardar Cambios</span>
    </button>
  </div>
</section>
