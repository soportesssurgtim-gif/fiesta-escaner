<!DOCTYPE html>
<html lang="es" class="h-full">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000060" />
  <link rel="manifest" href="/manifest.json" />
  <title>Fiesta de Empleados - SSSur</title>
  <link rel="icon" type="image/png" href="https://sansalvadorsur.gob.sv/images/logo-circulo-blanco.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Poppins', 'sans-serif'] },
          borderRadius: { 'ios': '1.75rem', 'ios-xl': '2.25rem' }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.lordicon.com/lordicon.js"></script>

  <style>
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      min-height: 100% !important;
      background-color: #f2f2f7;
      overflow-x: hidden;
    }

    #app {
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 0;
    }

    .app-container {
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 0;
    }

    @media (min-width: 768px) {
      .app-container {
        padding: 0 1rem;
      }
    }

    @media (min-width: 1024px) {
      .app-container {
        padding: 0 2rem;
      }
    }

    *, html, body, button, input, textarea, select, option, label {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .fa, .fas, .far, .fal, .fad, .fab, [class*="fa-"] {
      font-family: "Font Awesome 6 Free", "Font Awesome 6 Brands" !important;
    }

    /* Skeleton de carga sin dependencia de Tailwind */
    #app-skeleton {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #f2f2f7;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #app-skeleton .skeleton-inner {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #475569;
      font-size: 14px;
      font-weight: 600;
    }
    #app-skeleton .skeleton-spinner {
      width: 20px;
      height: 20px;
      border: 3px solid #cbd5e1;
      border-top-color: #001ba0;
      border-radius: 50%;
      animation: skeleton-spin 0.8s linear infinite;
    }
    @keyframes skeleton-spin {
      to { transform: rotate(360deg); }
    }

    .modal-overlay {
      position: fixed;
      top: -1rem;
      bottom: -1rem;
      left: -1rem;
      right: -1rem;
      z-index: 50;
      background-color: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .ios-btn {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .ios-btn:active {
      transform: scale(0.96);
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.15); border-radius: 10px; }

    /* Layout full-width: el contenido principal usa todo el ancho disponible */
    main, .view-container {
      max-width: 100% !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
    }
    @media (min-width: 768px) {
      main, .view-container {
        padding-left: 1rem;
        padding-right: 1rem;
      }
    }
    @media (min-width: 1024px) {
      main, .view-container {
        padding-left: 2rem;
        padding-right: 2rem;
      }
    }

    /* Contenedores de tarjeta usan todo el ancho disponible en pantallas grandes */
    @media (min-width: 1024px) {
      .bg-white.rounded-\[2\.5rem\] {
        max-width: 100% !important;
      }
    }

    /* Sidebar y contenido principal */
    aside {
      transition: transform 0.3s ease, width 0.3s ease;
    }
    main {
      transition: margin-left 0.3s ease;
    }
    @media (max-width: 767px) {
      main {
        margin-left: 0 !important;
      }
    }

    /* Sidebar colapsado: centrar iconos */
    aside .fa,
    aside [class*="fa-"] {
      transition: margin 0.2s ease;
    }
    aside:not(:hover) button span:not(.absolute) {
      transition: opacity 0.2s ease;
    }
    aside .absolute.left-full {
      z-index: 50;
    }

    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 380px;
    }
    .toast {
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      animation: toastIn 0.3s ease-out;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast-exito { background: #059669; }
    .toast-error { background: #dc2626; }
    .toast.fade-out {
      animation: toastOut 0.3s ease-in forwards;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(100px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(100px); }
    }

    #lector-qr video {
      border-radius: 12px !important;
    }
    #lector-qr #reader {
      border-radius: 12px !important;
      border: none !important;
    }
    #lector-qr #reader__scan_region {
      background: transparent !important;
    }
    #lector-qr #reader__dashboard_section_csr button {
      background: #001ba0 !important;
      color: white !important;
      border-radius: 12px !important;
      padding: 10px 14px !important;
      font-weight: 700 !important;
    }
  </style>
</head>

<body class="h-full m-0 p-0 antialiased">

  <div id="app-skeleton">
    <div class="skeleton-inner">
      <div class="skeleton-spinner"></div>
      <span>Cargando sistema…</span>
    </div>
  </div>
  
  <div class="hidden md:ml-64 md:ml-20"></div>

  <div id="app" class="min-h-screen flex flex-col w-full"></div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/tarjetas.js"></script>
  <script src="assets/js/offline.js"></script>
  <script src="assets/js/guias.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').then(function(reg) {
          console.log('SW registrado:', reg.scope);
        }).catch(function(err) {
          console.warn('SW fallo:', err);
        });
      });
    }
  </script>
</body>
</html>
