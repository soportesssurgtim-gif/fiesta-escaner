    iOS no lee el manifest para instalar: usa estas etiquetas. Sin
    apple-touch-icon, "Agregar a inicio" guarda una captura de la página en vez

    su barra en lugar de a pantalla completa.

  <!--
    Modo claro/oscuro antes de pintar nada.

    Este script va acá arriba y bloqueante a propósito: si esperáramos a que
    cargue app.js, la página aparecería un instante en claro y después saltaría
    a oscuro. Ese parpadeo blanco es muy molesto de noche, que es justo cuando
    se opera el evento.
  -->
  <script>
    (function aplicarTemaGuardado() {
      try {
        var guardado = localStorage.getItem('sssur_tema');
        var prefiereOscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (guardado === 'oscuro' || (!guardado && prefiereOscuro)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        // Si el navegador tiene el almacenamiento bloqueado, seguimos en claro.
      }
    })();
  </script>

  <!-- Pantalla de carga. Vive fuera de #app porque tiene que verse antes de
       que Vue exista, y se esconde sola cuando la app termina de montar. -->

  <script>
    /*
      Service worker: solo en producción.

      En desarrollo hace más daño que bien. Guarda los archivos en caché y los
      sirve desde ahí, así que uno edita un .js, recarga, y el navegador sigue
      ejecutando la versión vieja. Se pierde un buen rato depurando código que
      ya no existe.

      Por eso en localhost no solo NO lo registramos: además damos de baja
      cualquiera que hubiera quedado registrado antes y vaciamos su caché.
    */
    (function gestionarServiceWorker() {
      if (!('serviceWorker' in navigator)) return;

      var esDesarrollo = ['localhost', '127.0.0.1', ''].indexOf(location.hostname) !== -1;

      if (esDesarrollo) {
        navigator.serviceWorker.getRegistrations().then(function (registros) {
          registros.forEach(function (registro) { registro.unregister(); });
        });
        if (window.caches) {
          caches.keys().then(function (nombres) {
            nombres.forEach(function (nombre) { caches.delete(nombre); });
          });
        }
        return;
      }

      /*
        Actualización forzada.

        Sin esto, un despliegue nuevo no llegaba a los teléfonos: la aplicación
        instalada seguía sirviendo lo que tenía guardado y la única salida era
        borrar el caché del sitio a mano, cosa que nadie va a hacer en medio de
        un evento.

        El mecanismo es este. El sw.js hace skipWaiting() al instalar y
        clients.claim() al activar, así que la versión nueva toma el control
        apenas se descarga, sin esperar a que se cierren las pestañas. Cuando
        eso pasa, el navegador dispara 'controllerchange' y acá recargamos.

        `teniaControlador` se lee ANTES de registrar nada: en la primera visita
        no hay controlador, el primer claim también dispara el evento, y sin
        esta guarda la página se recargaría sola la primera vez que alguien
        entra, sin motivo.

        Recargar es seguro: la sesión vive en localStorage y los escaneos
        pendientes en IndexedDB. No se pierde nada en el camino.
      */
      var teniaControlador = Boolean(navigator.serviceWorker.controller);
      var recargando = false;

      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!teniaControlador || recargando) return;
        recargando = true;
        location.reload();
      });

      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').then(function (registro) {
          // El navegador solo revisa sw.js por su cuenta cada 24 horas. Para un
          // sistema que se corrige durante el evento mismo eso es demasiado,
          // así que preguntamos nosotros.
          registro.update();
          setInterval(function () { registro.update(); }, 15 * 60 * 1000);

          // Y también al volver a la pestaña o a la aplicación, que es el
          // momento en que alguien retoma el trabajo.
          document.addEventListener('visibilitychange', function () {
            if (!document.hidden) registro.update();
          });
        }).catch(function (error) {
          console.warn('[sw] No se pudo registrar el service worker:', error);
        });
      });
    })();
  </script>
