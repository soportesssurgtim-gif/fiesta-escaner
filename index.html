    iOS no lee el manifest para instalar: usa estas etiquetas. Sin
    apple-touch-icon, "Agregar a inicio" guarda una captura de la página en vez

  <!--
    Modo claro/oscuro antes de pintar nada.

    Este script va acá arriba y bloqueante a propósito: si esperáramos a que
    cargue app.js, la página aparecería un instante en claro y después saltaría
    a oscuro. Ese parpadeo blanco es muy molesto de noche, que es justo cuando
    se opera el evento.
  -->
  <script>
    /*
      La paleta de la marca, antes del primer pintado.

      Se lee ya derivada del cache: el algoritmo que la calcula vive en
      assets/js/nucleo/marca.js y no puede correr acá sin duplicarlo entero.
      Si no hay nada cacheado no se hace nada y quedan los valores por defecto
      de sistema-diseno.css, que son el color original.
    */
    (function aplicarPaletaGuardada() {
      try {
        var paleta = JSON.parse(localStorage.getItem('sssur_paleta') || 'null');
        if (!paleta) return;

        var raiz = document.documentElement;
        var pasos = [25, 50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950];

        for (var i = 0; i < pasos.length; i++) {
          var hex = paleta[pasos[i]];
          if (!/^#[0-9a-f]{6}$/i.test(hex || '')) return;  // cache corrupto: se ignora entero

          var n = parseInt(hex.slice(1), 16);
          raiz.style.setProperty('--marca-' + pasos[i], hex);
          raiz.style.setProperty(
            '--marca-' + pasos[i] + '-rgb',
            ((n >> 16) & 255) + ' ' + ((n >> 8) & 255) + ' ' + (n & 255)
          );
        }
      } catch (e) {
        // Almacenamiento bloqueado o JSON roto: se sigue con el color por defecto.
      }
    })();

    (function aplicarTemaGuardado() {
      try {
        // Mismo orden de prioridad que assets/js/nucleo/tema.js: la elección
        // personal manda sobre el tema institucional, y ese sobre el sistema
        // operativo. Acá va duplicado a propósito: tiene que correr antes de
        // cargar cualquier módulo o se ve el parpadeo que este script evita.
        var personal = localStorage.getItem('sssur_tema');
        var institucional = localStorage.getItem('sssur_tema_sistema');
        var elegido = personal || institucional;

        var oscuro = elegido
          ? elegido === 'oscuro'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (oscuro) document.documentElement.classList.add('dark');
      } catch (e) {
        // Si el navegador tiene el almacenamiento bloqueado, seguimos en claro.
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'ui-sans-serif', 'system-ui', 'sans-serif']
          },
          colors: {
            /*
              La marca NO lleva colores fijos: apunta a las variables CSS que
              define assets/css/sistema-diseno.css, y que reescribe
              assets/js/nucleo/marca.js cuando la institución configura otro
              color primario.

              Van como terna «R G B» dentro de rgb() y no como hex porque así
              sigue funcionando la opacidad de Tailwind: bg-brand-500/20.
            */
            brand: {
              25: 'rgb(var(--marca-25-rgb) / <alpha-value>)',
              50: 'rgb(var(--marca-50-rgb) / <alpha-value>)',
              100: 'rgb(var(--marca-100-rgb) / <alpha-value>)',
              200: 'rgb(var(--marca-200-rgb) / <alpha-value>)',
              300: 'rgb(var(--marca-300-rgb) / <alpha-value>)',
              400: 'rgb(var(--marca-400-rgb) / <alpha-value>)',
              500: 'rgb(var(--marca-500-rgb) / <alpha-value>)',
              600: 'rgb(var(--marca-600-rgb) / <alpha-value>)',
              700: 'rgb(var(--marca-700-rgb) / <alpha-value>)',
              800: 'rgb(var(--marca-800-rgb) / <alpha-value>)',
              900: 'rgb(var(--marca-900-rgb) / <alpha-value>)',
              950: 'rgb(var(--marca-950-rgb) / <alpha-value>)'
            },
            gray: {

              300: '#d0d5dd', 400: '#98a2b3', 500: '#667085', 600: '#475467',
              700: '#344054', 800: '#1d2939', 900: '#101828', 950: '#0c111d',
              dark: '#1a2231'
            },
            success: {
              25: '#f6fef9', 50: '#ecfdf3', 100: '#d1fadf', 200: '#a6f4c5',
              300: '#6ce9a6', 400: '#32d583', 500: '#12b76a', 600: '#039855',
              700: '#027a48', 800: '#05603a', 900: '#054f31', 950: '#053321'
            },

              300: '#fda29b', 400: '#f97066', 500: '#f04438', 600: '#d92d20',

            warning: {

          fontSize: {
            'title-2xl': ['72px', '90px'],

            'title-lg': ['48px', '60px'],

      }

  </script>

<body>
  <!-- Pantalla de carga. Vive fuera de #app porque tiene que verse antes de
       que Vue exista, y se esconde sola cuando la app termina de montar. -->
  <div id="pantalla-carga" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:var(--fondo-pagina,#f9fafb)">
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:24px">
      <div style="width:40px;height:40px;border:3px solid #e4e7ec;border-top-color:#465fff;border-radius:50%;animation:girar .8s linear infinite"></div>
      <p id="pantalla-carga-texto" style="margin:0;font-size:14px;font-weight:500;color:#667085">Iniciando el sistema…</p>
    </div>
  </div>

  <div id="app"></div>

  <!-- Un solo punto de entrada. app.js importa el resto como módulos ES. -->
  <script type="module" src="/assets/js/app.js"></script>

  <script>
    /*
      Service worker: solo en producción.

      En desarrollo hace más daño que bien. Guarda los archivos en caché y los
      sirve desde ahí, así que uno edita un .js, recarga, y el navegador sigue
      ejecutando la versión vieja. Se pierde un buen rato depurando código que
      ya no existe.

      Por eso en localhost no solo NO lo registramos: además damos de baja
      cualquiera que hubiera quedado registrado antes y vaciamos su caché.
    */
    (function gestionarServiceWorker() {
      if (!('serviceWorker' in navigator)) return;

      var esDesarrollo = ['localhost', '127.0.0.1', ''].indexOf(location.hostname) !== -1;

      if (esDesarrollo) {
        navigator.serviceWorker.getRegistrations().then(function (registros) {
          registros.forEach(function (registro) { registro.unregister(); });
        });
        if (window.caches) {
          caches.keys().then(function (nombres) {
            nombres.forEach(function (nombre) { caches.delete(nombre); });
          });
        }
        return;
      }

      /*
        Actualización forzada.

        Sin esto, un despliegue nuevo no llegaba a los teléfonos: la aplicación
        instalada seguía sirviendo lo que tenía guardado y la única salida era
        borrar el caché del sitio a mano, cosa que nadie va a hacer en medio de
        un evento.

        El mecanismo es este. El sw.js hace skipWaiting() al instalar y
        clients.claim() al activar, así que la versión nueva toma el control
        apenas se descarga, sin esperar a que se cierren las pestañas. Cuando
        eso pasa, el navegador dispara 'controllerchange' y acá recargamos.

        `teniaControlador` se lee ANTES de registrar nada: en la primera visita
        no hay controlador, el primer claim también dispara el evento, y sin
        esta guarda la página se recargaría sola la primera vez que alguien
        entra, sin motivo.

        Recargar es seguro: la sesión vive en localStorage y los escaneos
        pendientes en IndexedDB. No se pierde nada en el camino.
      */
      var teniaControlador = Boolean(navigator.serviceWorker.controller);
      var recargando = false;

      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!teniaControlador || recargando) return;
        recargando = true;
        location.reload();
      });

      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').then(function (registro) {
          // El navegador solo revisa sw.js por su cuenta cada 24 horas. Para un
          // sistema que se corrige durante el evento mismo eso es demasiado,
          // así que preguntamos nosotros.
          registro.update();
          setInterval(function () { registro.update(); }, 15 * 60 * 1000);

          // Y también al volver a la pestaña o a la aplicación, que es el
          // momento en que alguien retoma el trabajo.
          document.addEventListener('visibilitychange', function () {
            if (!document.hidden) registro.update();
          });
        }).catch(function (error) {
          console.warn('[sw] No se pudo registrar el service worker:', error);
        });
      });
    })();
  </script>
